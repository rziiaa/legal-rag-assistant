[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-assistant"
version = "0.1.0"
description = "LexCommande : assistant RAG sur le Code de la commande publique, avec citations et refus explicite."
requires-python = ">=3.11"
dependencies = [
    "lxml>=5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lra.db" = ["*.sql"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
